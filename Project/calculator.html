    <script>
      // ============================================
      // منطق الحاسبة البسيطة
      // ============================================
      const exprEl = document.getElementById("calcExpr");
      const resultEl = document.getElementById("calcResult");
      let expression = "";

      function displayToArabicOps(str) {
        return str.replace(/\*/g, "×").replace(/\//g, "÷").replace(/-/g, "−");
      }

      function updateScreen() {
        exprEl.textContent = expression
          ? displayToArabicOps(expression)
          : "\u00A0";
      }

      function safeEvaluate(expr) {
        // السماح فقط بالأرقام والعمليات الأساسية والنقطة والنسبة المئوية
        if (!/^[0-9+\-*/.%\s]*$/.test(expr)) return null;
        try {
          // eslint-disable-next-line no-new-func
          const value = Function(
            '"use strict"; return (' + expr.replace(/%/g, "/100") + ")",
          )();
          if (typeof value !== "number" || !isFinite(value)) return null;
          return Math.round(value * 1e10) / 1e10;
        } catch (e) {
          return null;
        }
      }

      document.querySelectorAll(".calc-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const action = btn.dataset.action;
          const value = btn.dataset.value;

          if (action === "clear") {
            expression = "";
            resultEl.textContent = "0";
            updateScreen();
            return;
          }

          if (action === "backspace") {
            expression = expression.slice(0, -1);
            updateScreen();
            resultEl.textContent = expression
              ? (safeEvaluate(expression) ?? resultEl.textContent)
              : "0";
            return;
          }

          if (action === "equal") {
            const value = safeEvaluate(expression);
            if (value === null) {
              resultEl.textContent = "خطأ";
            } else {
              resultEl.textContent = value;
              expression = String(value);
            }
            updateScreen();
            return;
          }

          // منع بدء التعبير بعملية حسابية (باستثناء الطرح)
          if (["+", "*", "/", "%"].includes(value) && expression === "") return;

          expression += value;
          updateScreen();

          const live = safeEvaluate(expression);
          if (live !== null) resultEl.textContent = live;
        });
      });

      updateScreen();
    </script>
